name: GhostHunt
version: "${version}"
main: com.ghosthunt.GhostHuntPlugin
description: 鬼抓人：大樓逃生
api-version: '26.3'

commands:
  ghosthunt:
    description: 鬼抓人主指令
    usage: /ghosthunt <start|stop|build|clear|tp|fog|info|reload>
    permission: ghosthunt.use
    aliases: [gh]

permissions:
  ghosthunt.use:
    default: true
  ghosthunt.admin:
    default: op
  ghosthunt.heart.1:           # 心跳暗角（BetterHud 的 layout 看這個權限；插件依心跳段數暫時給玩家，誰都不預設有）
    default: false
  ghosthunt.heart.2:
    default: false
  ghosthunt.heart.3:
    default: false
  ghosthunt.heart.4:
    default: false
