name: GhostHunt
version: "${version}"
main: com.ghosthunt.GhostHuntPlugin
description: 鬼抓人：大樓逃生
api-version: '26.3'

commands:
  ghosthunt:
    description: 鬼抓人主指令
    usage: /ghosthunt <start|stop|build|clear|tp|fog|info|reload>
    permission: ghosthunt.use
    aliases: [gh]

permissions:
  ghosthunt.use:
    default: true
  ghosthunt.admin:
    default: op
