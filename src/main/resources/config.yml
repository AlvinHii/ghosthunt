# 鬼抓人：大樓逃生 設定檔（企劃書 v3.1）
# 數值都要實際玩過才知道對不對，改完用 /ghosthunt reload 重新載入
# 時間單位：秒；距離單位：格；「依人數」的值依序是 3 / 4 / 5 個逃生者

map:
  world: ghosthunt_arena       # 遊戲用的虛空世界（沒有會自動建立）
  origin: {x: 0, y: 64, z: 0}  # 大樓西北角的位置
  blocks-per-tick: 4000        # 蓋大樓時每 tick 放幾個方塊（太大會卡）
  door-chance: 0.5            # 一般房間的門口有多少機率是雙開門（其他是可以放障礙物的空門口）
  crawl-hole-chance: 0.4       # 一般房間有多少機率多一個蹲伏破洞（逃生者蹲下鑽得過，鬼過不去）
  corridor-clutter: 0.06       # 走廊地上雜物的密度（每格放的機率）；走廊天花板另有通風管
  fog-distance: "14"           # 平常的霧（只送給逃生者，鬼看不到）：off 或 4/6/8/12/14/16/24/32/48（幾格外完全看不見）
  normal-light-level: 10       # 電源開著時的燈光亮度（0～15）
  emergency-light-level: 1     # 緊急照明亮度（0～15）；實測 4 以下看起來差不多，先用 1
  generator: irregular         # irregular = 凹凸外型＋隨機房間（新）；grid = 舊的九宮格大樓
  cell-size: 10                # 不規則大樓：外型圖一格是幾×幾方塊
  shape:                       # 不規則大樓的外型（# = 大樓範圍，. = 外面；3 層都一樣，每局固定，房間每局隨機）
    - "..#####.."
    - "########."
    - "#########"
    - "########."
    - ".########"
    - ".#######."
    - "....###.."
  hideouts-per-floor: 3        # 不規則大樓：每層幾個牆中暗格（只能蹲著鑽進去躲）
  crawl-tunnels-per-floor: 4   # 不規則大樓：每層幾條房間之間的鑽洞通道
  topple-cabinet-chance: 0.45  # 不規則大樓：空門口旁邊放「可以推倒的櫃子」的機率（逃生者右鍵推倒，把門口擋住，鬼要拆）
  barrel-area: 140             # 不規則大樓：木桶密度，每幾格地板一個
  tunnels: 4                  # 不規則大樓：1F 底下的地下通道條數（地上活板門＋梯子下去，連到遠處另一個房間；鬼要先撬開出入口）
  floor-height: 5              # 層高：樓板 1 格＋牆 4 格（樓梯 5 階，房間格至少要 8 格寬）
  floors: 3
  rooms-per-side: 3            # （grid）每層 3×3 個房間格（中間那格四面都接走廊）
  room-size: 20                # 每個房間格 20×20（內部 18×18，平面圖見 docs/房間設計v2.md），整層 68×68
  corridor-layout: grid        # 井字走廊：第 1、2 排和第 3、4 排房間格之間各一條（整層 38×38，待實際看過再定）
  corridor-width: 3
  stairwells-per-floor: 2      # 放在對角兩端
  max-dead-ends-per-floor: 2   # 生成後檢查：每層最多幾條死路

pve:                           # PvE 小地圖（/gh build pve）：2～3 個逃生者對抗 AI 鬼
  map: mall_m                  # 固定地圖（plugins/GhostHunt/pve-maps/名字.txt，格式見 docs/PvE地圖格式.md）；random = 用下面的外型隨機產生
  reroll-each-match: true      # 固定地圖每局開始前重蓋一次：大門、保全室、木桶重新隨機
  shape:                       # 外型（同 map.shape；一格 map.cell-size）
    - ".####."
    - "######"
    - "#####."
    - "######"
    - ".###.."
  floors: 2
  hideouts-per-floor: 2
  crawl-tunnels-per-floor: 2
  tunnels: 2
  barrel-area: 90              # 木桶密度：每幾格地板一個（大樓是 map.barrel-area: 140）

ghost:
  release-delay: 30            # 鬼開局被關在鬼房的時間
  speed-bonus-by-survivors: [0.03, 0.05, 0.07]  # 鬼比逃生者快多少，依人數；開局決定，整場不變
  capture-cooldown: 3          # 抓到人之後多久不能再抓
  cut-power-time: 3            # 鬼關電源要站多久（一局一次）
  attack-fatigue: 1.5          # 每揮一次手（打到或揮空）之後的疲勞時間，期間抓不到人
  night-vision: true           # 鬼整場自帶夜視（停電、熄燈時也看得清楚）
  attack-fatigue-slow: 0.9     # 疲勞時減速多少（0.9 = 速度只剩 10%，幾乎停住）
  break-door-jam: 2.5          # 鬼撞開被卡住的門要站多久（撞開後那扇門不能再卡）
  break-barricade: 3.5         # 鬼破壞障礙物所需時間
  widen-crawl-hole: 4          # 鬼打大蹲伏洞所需時間

movement:
  allow-jump: false            # 逃生者和鬼都不能跳
  allow-sprint: true

ai-ghost:                      # PvE 的 AI 鬼（/gh start ai [easy|normal|hard]）
  difficulty: normal           # 預設難度（presets 底下的值會蓋掉下面的同名設定）
  mob: HUSK                    # 用哪種怪物當身體（要跟玩家差不多高：過得了門、鑽不過蹲伏小洞）
  footsteps: false             # 鬼的腳步聲（關掉：只靠逃生者的心跳判斷鬼多近）
  base-speed: 0.45             # 基本速度（怪物的速度數值；約等於玩家跑步每秒 5.6 格）；依人數的加成、揮拳減速跟真人鬼一樣
  chase-speed: 1.0             # 看到人追的時候的速度倍率
  search-speed: 0.9            # 去聽到聲音、感應到的房間、追丟後找人、去弄壞大門
  patrol-speed: 0.75           # 巡邏、守監獄、去關電源（約等於走路）
  sight-range: 24              # 看得到人的距離（視線沒被擋；對方的眼睛、胸口、腳任一點看得到就算）
  sight-range-dark: 14         # 停電時看得到的距離
  fov: 120                     # 視野角度（度）：只看得到前方
  near-aware: 3                # 這麼近的話不分方向都察覺得到
  think-every: 5               # 每幾 tick 想一次下一步（攻擊是每 tick 判斷）
  reaction: 0.3                # 揮拳前搖：進入攻擊距離後多久揮出去（有預警音效）
  attack-range: 2.5            # 攻擊距離（腳到腳；故意比真人鬼短一點，平衡 AI 的感應）
  whiff-chance: 0.3            # 前搖結束時人已經退出範圍，還是揮出去（揮空）的機率
  search-time: 10              # 追丟後找多久；聽到的聲音也記這麼久
  search-cap: 25               # 搜尋的子目標（去地洞另一端、查暗格、往逃跑方向找）最多把搜尋延長到幾秒
  noise-error: 3               # 聽到聲音的位置誤差（格）
  hear-sprint: 8               # 聽得到多遠的跑步聲
  hear-walk: 4                 # 聽得到多遠的走路聲（蹲著走沒有聲音）
  hear-door: 12                # 聽得到多遠的開關門聲
  sense-quiet: 45              # 多久沒看到、沒聽到任何人才「感應」一次最近的人在哪一間房（被盯上的人聽到心跳加快）
  sense-gap: 45                # 兩次感應至少隔多久
  pressure-limit: 60           # 壓力值：近距離看得到人時每秒 +1，到這個值（連續緊追太久）進入冷靜期
  calm-time: 30                # 冷靜期（也包括剛抓到人之後）：不感應、巡邏偏向遠的地方
  guard-jail-chance: 0.5       # 有人被關時去守監獄的機率
  guard-cap: 45                # 守監獄最久幾秒
  check-hideout-base: 0.4      # 追丟時查附近暗格的基礎機率；再乘證據倍率（在鬼眼前鑽進去、之後沒聲音 ×2.5；粒子 30% 以上在裡面 ×2；離 8 格以上 ×0.3），上限 95%
  check-hideout-noise-chance: 0.2  # 到了聲音、感應的位置後去查附近暗格的機率
  follow-tunnel-chance: 0.5    # 看到人鑽進地洞時跟下去（撬開、爬梯子、走通道，或從地面繞過去）的機率
  stuck-time: 2                # 幾秒幾乎沒移動算卡住
  power-cut-delay: 20          # 電源打開幾秒後才會去關（不要一開電就衝去關）
  flash-time: 1.0              # 手電筒要連續照臉多久才有效
  flash-blind: 1.5             # 照到之後幾秒看不到人
  flash-immune: 12             # 之後幾秒不會再被照到
  particles: 200               # 追丟後的粒子濾波：每個逃生者撒幾顆粒子（猜他可能在哪）
  particle-flee: 0.6           # 粒子每一步往「離鬼更遠」走的機率
  particle-goal: 0.25          # 往逃生者下一個遊戲目標（電源／終端機／讀卡機）走的機率；其他是隨機
  particle-sigma: 3            # 聽到聲音、看到痕跡時，附近幾格的粒子權重加倍（高斯半徑）
  particle-min: 10             # 粒子剩不到幾顆就放棄
  particle-max-age: 40         # 追丟後最多推理幾秒（取代 search-cap）
  escaper-speed: 5.6           # 推理時假設逃生者的跑速（每秒幾格）
  intercept-chance: 0.5        # 追人時「繞到前面堵」的機率（每次開始追擲一次；猜得到對方要往哪個出口跑、鬼會先到才堵）
  ambush-time: 25              # 冷靜期的退場埋伏：在逃生者往下一個目標會經過的咽喉點旁邊、看不到的地方最多等幾秒（0 = 不埋伏）
  guard-reader-cap: 40         # 有人授權後守大門讀卡機，每次最多幾秒（之後走開一半的時間再回來；0 = 不守）
  cut-power-advantage: 15      # 關電源的時機：他們走回電源的平均秒數 − 鬼走過去的秒數 ≥ 這個值才去關
  cut-power-max-wait: 90       # 電源開了這麼多秒以後不管時機，直接去關
  tactical-approach: 0         # 戰術尋路（1 = 開）：去「做事的聲音」那裡時避開那裡看得到的格子，從視線外摸過去（預設只有困難開）
  sneak-penalty: 3             # 戰術尋路時，對方看得到的格子每格多算幾格距離
  brain: utility               # 大腦：utility（第三版：打分數＋個性）或 rules（第二版的固定優先順序）
  persona: auto                # 個性：auto（用記憶裡的勝率自動選，Thompson sampling）、hound、ambusher、watcher、standard；開局指令可以指定
  learn: true                  # 學習（plugins/GhostHunt/ai-memory/<地圖>.yml）：被哪招甩掉、熱點、路線、個性勝率。/gh aimemory reset 清掉
  learn-from-dummies: false    # 假逃生者也算進學習（測試用）
  memory-decay: 0.85           # 每局結束舊資料乘這個（舊習慣慢慢淡掉）
  personas:                    # 個性的數值（覆寫內建值；權重的 key 是目標名稱，例如 chase、ambush、guard-jail）
    hound:                     # 獵犬：一直追、很難甩掉（腳步聲比較高、發現人時狼嚎）
      chase: 1.3
      search-last-seen: 1.2
      ambush: 0.6
      particle-age: 0.7        # 推理粒子的時間 ×0.7
    ambusher:                  # 埋伏者：每次追人都算繞前堵、愛埋伏（腳步聲比較低、發現人時嗅聞聲）
      ambush: 1.5
      chase: 0.9
      ambush-time: 1.4         # 埋伏時間 ×1.4
    watcher:                   # 守望者：守監獄、守讀卡機、巡邏偏向咽喉點（腳步聲很低、發現人時咆哮）
      guard-jail: 1.5
      guard-reader: 1.5
      choke-patrol: 1.5
      guard-jail-add: 0.25     # 守監獄機率 +0.25
  presets:                     # 難度：只調感知和決策，不調跑速
    easy:
      reaction: 0.5
      sight-range: 18
      sense-quiet: 75
      whiff-chance: 0.6
      check-hideout-base: 0.25
      particles: 80              # 簡單：粒子少、只隨機走（不會推理「往離鬼遠的地方跑」）
      particle-flee: 0
      particle-goal: 0
      intercept-chance: 0        # 簡單：不繞前堵
    normal: {}
    hard:
      reaction: 0.2
      sight-range: 28
      sense-quiet: 30
      whiff-chance: 0.1
      check-hideout-base: 0.6
      particles: 400
      intercept-chance: 1.0      # 困難：每次追人都算要不要繞前堵
      tactical-approach: 1       # 困難：從視線外摸過去

heartbeat:                     # 逃生者的心跳（鬼越近越快、越大聲、音調越高；夢魘熄燈時改成低語）
  sound: minecraft:entity.warden.heartbeat   # 音效（之後換成資源包的心跳，例如 ghosthunt:heartbeat）
  distance: path               # path = 鬼走過來要走的路（隔牆要繞遠路就不會狂跳；AI 局才有，真人鬼的局用直線）、straight = 直線距離
  range: 32                    # 幾格內有心跳
  min-bpm: 55                  # 範圍邊緣每分鐘幾下
  max-bpm: 150                 # 貼臉時每分鐘幾下
  min-volume: 0.3
  max-volume: 1.0
  close-pitch: 1.15            # 貼臉時的音調（邊緣是 1.0）
  stage-sounds:                # 4 段心跳音檔（由遠到近；每段是固定速度的循環）。有填就用這個，空的就用上面的「單一下」心跳
    - ghosthunt:heartbeat.1    # 60 下／分（遠）
    - ghosthunt:heartbeat.2    # 75（附近）
    - ghosthunt:heartbeat.3    # 100（很近）
    - ghosthunt:heartbeat.4    # 130（就在旁邊）
  stage-distances: [32, 20, 12, 6]   # 鬼的沿路距離 ≤ 這些格數就換到那一段（退遠時多 2 格才換回去，不會一直切）
  stage-loop: 24               # 每段音檔幾秒（同一段每這麼多秒重播一次）
  stage-volume: 1.0            # 最大 1.0（再大只會傳更遠、不會更大聲）；太大聲的人可以自己調遊戲裡的「玩家」音量
  category: players            # 心跳走哪個音量滑桿：players（玩家）／master（主音量）／ambient（環境）……

survivor:
  dash-duration: 1.5           # 緊急衝刺（F 鍵）持續時間
  dash-speed-bonus: 0.5        # 衝刺速度 +50%（不跟其他加速疊加，取最高）
  dash-cooldown: 45            # 緊急衝刺冷卻
  coop-max-players: 2          # 合作開／修電源最多算幾人
  coop-radius: 3
  crawl-hole-speed-bonus: 0.3  # 蹲著鑽破洞時：不吃蹲下的減速，另外補回跑步的速度（+30%）；有衝刺／被救加速時不疊加

interaction:                   # 點一下開始，站著不動等進度條；走動超過半格、被抓、開背包會中斷
  cancel-move-distance: 0.5
  search-container: 2          # 翻容器
  pry-locked-container: 5      # 撬開上鎖箱
  power-on: 5                  # 開總電源
  power-repair: 6              # 修電源（被鬼關掉或隨機斷電）
  swipe-card: 3                # 刷卡
  restart-gate: 3              # 重新啟動故障的大門（不用卡）
  jam-door: 1                  # 逃生者卡門（蹲下右鍵雙開門）；每扇門一局只能卡一次，卡住後誰都打不開，鬼要撞開
  authorize-card: 5            # 在保全室的終端機授權門禁卡（會發出聲音）
  team-power-multiplier: 1.5   # 兩人一起開／修電源的速度倍率
  noise-radius: 16             # 同一層多少格內的鬼收到聲音方向（八個方向箭頭；牆不擋；不同樓層聽不到）

jail:
  per-floor: true              # 每層一間監獄，傳送到離鬼最遠的那間
  rescue-time-by-survivors: [4, 5, 6]   # 一次救出那間監獄裡的所有人；多人一起救不加速
  camp-radius: 12              # 鬼在監獄多少格內算守監獄（同一層、直線距離、隔牆也算；每間監獄分開算）
  camp-time: 10                # 累計守多久後救援時間縮短
  camp-rescue-time: 2          # 守監獄時的救援時間
  camp-recover-time: 10        # 鬼離開多久後計時完全歸零
  rescue-speed-boost: 3        # 被救後加速秒數
  rescue-speed-bonus: 0.4      # 被救後加速 +40%
  rescue-protection: 3         # 被救後不能被抓的秒數
  max-captures: 2              # 第幾次被抓就淘汰
  dropped-card-radius: 15      # 拿卡的人被抓，卡藏進同一層多少格內的容器（不算鬼的搬卡次數）

power:
  random-blackout-max: 1       # 一局最多幾次隨機斷電
  random-blackout-window: [300, 600]  # 電源開啟後多久之間隨機發生
  blackout-grace: 90           # 修好電源後多久內不會再斷電

keycard:
  count: 2                     # 刷卡會用掉卡，讀卡機保持解鎖
  reveal-interval: 90          # 鬼每隔多久看到卡的位置
  reveal-duration: 5           # 位置亮多久
  ghost-move-channel: 4        # 鬼搬卡要站多久；在亮起期間開始就算數，原地發動；每次亮起只能搬一張
  ghost-moves-per-card: 1
  decoy-locked-containers: 3   # 另外放幾個裝普通道具的上鎖箱
  require-authorization: true  # 門禁卡要先拿到保全室的終端機授權才能刷（大樓沒有保全室時自動關掉）

gate:
  count: 2                     # 大門數量，位置每局隨機
  min-distance: 25             # 兩扇門至少相隔多遠（且必在不同樓層）
  open-countdown: 25           # 刷卡後開門倒數（自動跑，不用守門）
  ghost-sabotage-time: 4       # 鬼讓大門故障要站多久（倒數回到滿，每門一次）

items:
  spawn-by-survivors:          # 地圖上生成的總數，依人數 3 / 4 / 5
    smoke: [3, 4, 5]
    speed-potion: [3, 4, 5]
    flashlight: [2, 2, 3]
    scanner: [2, 3, 3]
    barricade: [2, 3, 4]       # 另外每人開局 1 個
  allow-drop-to-teammates: true
  max-carry: 1                 # 每種道具最多拿幾個
  max-barricades: 2
  smoke-radius: 4              # 球形，隔牆也有效
  smoke-blind: 3
  speed-potion-bonus: 0.4
  speed-potion-duration: 5
  flashlight-range: 8
  flashlight-angle: 30         # 扇形角度，會被牆擋住
  flashlight-battery: 20
  flashlight-disrupt: 5        # 照到夢魘時打斷追蹤幾秒
  scanner-duration: 5

nightmare:
  first-use-delay: 60          # 離開鬼房後多久才能第一次關燈
  lights-out-duration: 90
  lights-out-cooldown: 150     # 從燈亮回來開始算
  trail-radius: 12
  idle-hint-after: 15
  whisper-radius: 8
  fog-distance: "8"             # 熄燈時的霧（同 map.fog-distance 的選項）

match:
  glow-start: 900              # 15 分鐘起還沒逃出的人全部發光（監獄裡的不發光）
  time-limit: 1020             # 17 分鐘強制結束
  record-stats: true           # 每局結束把數據寫進記錄檔
  # 不分勝負：場上沒有能自由行動的逃生者時立刻結束，只顯示每個人的結果

test-mode:                     # /gh start ai test [難度] [個性] [數量]：你當逃生者，被抓一次立刻重生、之後 AI 鬼無視你
  dummies: 3                   # 鬼出來時自動生幾個假逃生者（指令後面加數字可以改）

audio:                         # 地圖音效（地圖檔的 [sounds]）
  default-ambient: ghosthunt:ambient.default   # 地圖沒有自己的全場環境音時播的恐怖白噪音（空白 = 不播）
  default-ambient-volume: 0.5    # 檔案已經放大過；太大聲會蓋掉遠處的心跳
  default-ambient-loop: 30     # 白噪音檔案幾秒（每這麼多秒重播一次）

resource-pack:                 # 地圖音效的資源包（插件自己開一個小網頁伺服器送給玩家，進伺服器時會問要不要裝）
  enabled: true
  port: 8164                   # 網頁伺服器的 port（跟 Minecraft 的 25565 不一樣）
  host: localhost              # 玩家連得到的位址：自己電腦測試用 localhost；跟朋友連線要改成你的公開 IP 或網域（port 也要開）。
                               # 用 playit.gg：在 playit 新增一條 TCP 隧道指到本機 8164，這裡填 playit 給的「位址:port」（例如 xxx.gl.at.ply.gg:12345）
  url: ""                      # 自己把 ghosthunt-pack.zip 放在別的網站的話填網址（填了就不開網頁伺服器）
  required: false              # true＝不裝資源包就進不來

gimmicks:                      # 地圖專屬機關（地圖檔的 [interactions]，目前只有度假村）
  bell-cooldown: 45            # 迎賓鈴：全場共用冷卻（秒）
  lure-seconds: 8              # 遠處涼亭的廣播響多久（AI 鬼不管多遠都聽得到）
  lure-min-distance: 25        # 聲源至少離鐘多遠
  cart-uses: 2                 # 球車遠光燈：每台幾次
  cart-range: 8                # 強光距離（格）
  cart-angle: 35               # 扇形半角（度）
  cart-effect: 3               # 照到的鬼幾秒看不到人＋緩速 II
  steam-seconds: 10            # 溫泉蒸氣：噴多久
  steam-radius: 6              # 煙的範圍（格）
  steam-cooldown: 60           # 每座閥門噴完之後的冷卻（秒）
